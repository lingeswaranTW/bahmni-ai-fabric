name: Build & Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate_pr.yml
  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with: {context: ., push: false, load: true, tags: "bahmni/bahmni-ai:scan"}
      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: bahmni/bahmni-ai:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with: {username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}"}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: |
            bahmni/bahmni-ai:${{ github.ref_name }}
            bahmni/bahmni-ai:latest
