[project]
name = "bahmni-ai"
version = "0.1.0"
description = "Reusable AI chatbot backend for Bahmni: MCP tools, multiple LLM providers, OpenMRS-privilege-gated"
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.0.0",
    "pydantic-ai-slim[openai,anthropic,mcp]",
    "structlog>=24.0.0",
    "jsonschema>=4.20.0",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
]

[project.optional-dependencies]
# Observability (docs/OBSERVABILITY.md). Optional: without it telemetry is a no-op.
telemetry = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
    "types-jsonschema>=4.20.0",
    "fastmcp-slim[server]>=4.1.0",
    "aiosqlite>=0.22.1",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bahmni_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "E702"]
"spike/*" = ["S", "E", "B", "I"]
"deploy/*" = ["S603", "S310", "E501"]  # operator scripts: fixed docker/compose commands and a loopback UI
