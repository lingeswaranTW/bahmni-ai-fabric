# Fronts the OpenLIT UI. OpenLIT has open self-registration (Phase 0 finding): anyone who can reach the UI can create an
# account. Registration is blocked here; accounts are created by the operator (see ../README.md).
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    # NextAuth registration provider ("register"): sign-up form and callback
    location ~ ^/api/auth/(callback|signin)/register { return 403; }
    location / {
      proxy_pass http://openlit:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
