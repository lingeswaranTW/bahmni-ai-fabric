# Self-hosted OpenLIT (UI + ClickHouse) for bahmni-ai telemetry. A SEPARATE deployment: bahmni-ai only needs its OTLP URL.
# Derived from openlit/openlit tag openlit-2.1.0, hardened per docs/OBSERVABILITY.md section 10.1. Read README.md first.
name: bahmni-openlit
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.4.1
    environment:
      CLICKHOUSE_PASSWORD: ${OPENLIT_DB_PASSWORD:?set OPENLIT_DB_PASSWORD in .env.local}
      CLICKHOUSE_USER: ${OPENLIT_DB_USER:-openlit}
      CLICKHOUSE_DATABASE: ${OPENLIT_DB_NAME:-openlit}
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "true"
      TRACE_RETENTION_HOURS: ${TRACE_RETENTION_HOURS:-168}
      METRIC_RETENTION_HOURS: ${METRIC_RETENTION_HOURS:-720}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./assets/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
      - ./assets/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    # Nothing published: only the openlit container reaches ClickHouse (upstream publishes 8123 and 9000).
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 100s
    restart: unless-stopped

  openlit:
    image: ghcr.io/openlit/openlit:2.1.0
    environment:
      TELEMETRY_ENABLED: "false"   # upstream default "true" (vendor product telemetry)
      INIT_DB_HOST: clickhouse
      INIT_DB_PORT: 8123
      INIT_DB_DATABASE: ${OPENLIT_DB_NAME:-openlit}
      INIT_DB_USERNAME: ${OPENLIT_DB_USER:-openlit}
      INIT_DB_PASSWORD: ${OPENLIT_DB_PASSWORD:?set OPENLIT_DB_PASSWORD in .env.local}
      TRACE_RETENTION_HOURS: ${TRACE_RETENTION_HOURS:-168}
      SQLITE_DATABASE_URL: file:/app/client/data/data.db
      PORT: 3000
      DOCKER_PORT: 3000
      NEXTAUTH_URL: ${OPENLIT_PUBLIC_URL:-http://localhost:3300}
      OPAMP_ENVIRONMENT: production
      OPAMP_CERTS_DIR: "/app/opamp/certs"
      OPAMP_TLS_INSECURE_SKIP_VERIFY: "false"
      OPAMP_TLS_REQUIRE_CLIENT_CERT: "true"
      OPAMP_TLS_MIN_VERSION: "1.2"
      OPAMP_TLS_MAX_VERSION: "1.3"
      OPAMP_LOG_LEVEL: info
    # The UI port is NOT published here (see ui-proxy). OTLP is published for the bahmni-ai service; bind it to the
    # internal interface only. The OTLP receivers accept unauthenticated data: never expose them publicly.
    ports:
      - "${OPENLIT_OTLP_BIND:-127.0.0.1}:${OPENLIT_OTLP_HTTP_PORT:-4318}:4318"
      - "${OPENLIT_OTLP_BIND:-127.0.0.1}:${OPENLIT_OTLP_GRPC_PORT:-4317}:4317"
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - openlit-data:/app/client/data
      - ./assets/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Blocks OpenLIT's open self-registration endpoints; everything else is proxied to the UI.
  ui-proxy:
    image: nginx:1.27.5-alpine
    volumes:
      - ./assets/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${OPENLIT_UI_BIND:-127.0.0.1}:${OPENLIT_UI_PORT:-3300}:8080"
    depends_on:
      openlit:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
  openlit-data:
